; Proces renderowania po stronie serwera (Inertia SSR, Node 22+). Kopiuj do /etc/supervisor/conf.d/.
; Słucha na 127.0.0.1:13714 i jest używany tylko przez PHP. Bez niego strony nadal się wyświetlają
; (renderowanie w przeglądarce), ale roboty wyszukiwarek dostają pusty szkielet zamiast treści.
; Dlatego po każdym wdrożeniu trzeba go zrestartować (robi to deploy/deploy.sh), a niedziałający SSR
; wykrywa deploy/check-ssr.sh, który warto wpiąć w monitoring.
[program:drzwidopiekna-ssr]
command=php /var/www/drzwidopiekna/artisan inertia:start-ssr
directory=/var/www/drzwidopiekna
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/drzwidopiekna/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
