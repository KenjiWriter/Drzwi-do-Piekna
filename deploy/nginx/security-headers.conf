# Nagłówki bezpieczeństwa. Skopiuj do /etc/nginx/snippets/ddp-security-headers.conf.
# Dołączamy je w każdym location, które samo ustawia add_header (nginx nie dziedziczy wtedy nagłówków z serwera).

# HSTS: po sprawdzeniu, że HTTPS działa na obu domenach. Bez includeSubDomains i preload, dopóki
# poddomeny (poczta, inne usługi) nie są na pewno obsługiwane przez HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Panel /admin nie może być osadzany w obcych ramkach (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
