# nginx dla drzwidopiekna.pl: PHP-FPM, domena główna bez www, HTTPS, cache zasobów statycznych.
# Kopiuj do /etc/nginx/sites-available/drzwidopiekna.conf i włącz dowiązaniem w sites-enabled.
# Ścieżki (root, gniazdo PHP-FPM, certyfikaty) dopasuj do serwera. Opis: docs/DEPLOY.md.
#
# Czego tu NIE ma, bo robi to aplikacja:
# - przekierowania 301 ze starej strony WordPress (/blog/x/ -> /blog/x, /faq/ -> /kontakt, /en/... itd.)
#   oraz ukośnika końcowego: app/Http/Middleware/RedirectTrailingSlash.php i config/clinic.php,
# - robots.txt i sitemap.xml: generuje je Laravel (poza produkcją robots blokuje indeksowanie).
# Proces SSR (Node) słucha tylko na 127.0.0.1:13714 i nie jest wystawiony na zewnątrz.

# HTTP -> HTTPS, www -> domena główna (jednym skokiem)
server {
    listen 80;
    listen [::]:80;
    server_name drzwidopiekna.pl www.drzwidopiekna.pl;

    # Certbot (certbot --nginx) sam dopisuje tu wyjątek dla /.well-known/acme-challenge/.
    return 301 https://drzwidopiekna.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.drzwidopiekna.pl;

    ssl_certificate     /etc/letsencrypt/live/drzwidopiekna.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drzwidopiekna.pl/privkey.pem;

    return 301 https://drzwidopiekna.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drzwidopiekna.pl;

    root /var/www/drzwidopiekna/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/drzwidopiekna.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drzwidopiekna.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/ddp-security-headers.conf;

    # Zdjęcia z panelu mają do 12 MB. Zapas na nagłówki formularza multipart. Zgodnie z upload_max_filesize w PHP.
    client_max_body_size 14m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # Wszystko, czego nie ma jako plik, obsługuje Laravel (w tym robots.txt i sitemap.xml).
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Zasoby z Vite mają skrót w nazwie, więc można je cache'ować bez końca.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zdjęcia wgrane w panelu (nazwy z unikalnym identyfikatorem, nigdy nie są nadpisywane).
    location /storage/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zdjęcia demonstracyjne z `npm run images` mają stałe nazwy, więc krótszy cache.
    location /images/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zasoby panelu Filament (adresy mają ?v=wersja).
    location ~ ^/(css|js|fonts)/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Tylko front controller. Każdy inny plik .php (np. zostawiony przez pomyłkę) kończy się 404.
    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Pliki ukryte (.env, .git) nigdy nie wychodzą na zewnątrz. Wyjątek: .well-known dla certyfikatów.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Opcjonalnie: panel tylko z wybranych adresów IP (gabinet, dom). Odkomentuj i wpisz własne.
    # location ^~ /admin {
    #     allow 203.0.113.10;
    #     deny all;
    #     try_files $uri /index.php?$query_string;
    # }
}
