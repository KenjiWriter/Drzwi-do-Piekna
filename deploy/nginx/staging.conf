# nginx dla stagingu (demo.cerasusdigital.pl): PHP-FPM, jedna domena, cache zasobów statycznych.
# Używa tego deploy/provision-staging.sh (kopiuje do /etc/nginx/sites-available/<domena>.conf, podmienia domenę).
#
# Blok słucha tylko na porcie 80. HTTPS dopisuje certbot (certbot --nginx): dodaje listen 443 ssl, ścieżki certyfikatu
# i przekierowanie z http na https, więc po jego uruchomieniu ten plik wygląda inaczej niż w repozytorium. Dlatego skrypt
# nie nadpisuje go przy ponownym uruchomieniu. Wersja produkcyjna z www i HTTP/2: deploy/nginx/drzwidopiekna.conf.
#
# Czego tu NIE ma, bo robi to aplikacja:
# - przekierowania 301 ze starej strony WordPress oraz ukośnika końcowego (app/Http/Middleware/RedirectTrailingSlash.php),
# - robots.txt i sitemap.xml (poza produkcją robots.txt blokuje całe indeksowanie).
# Proces SSR (Node) słucha tylko na 127.0.0.1:13714 i nie jest wystawiony na zewnątrz.

server {
    listen 80;
    listen [::]:80;
    server_name demo.cerasusdigital.pl;

    root /var/www/drzwidopiekna/public;
    index index.php;
    charset utf-8;

    include snippets/ddp-security-headers.conf;

    # Zdjęcia z panelu mają do 12 MB. Zapas na nagłówki formularza multipart. Zgodnie z upload_max_filesize w PHP.
    client_max_body_size 14m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # Wszystko, czego nie ma jako plik, obsługuje Laravel (w tym robots.txt i sitemap.xml).
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Zasoby z Vite mają skrót w nazwie, więc można je cache'ować bez końca.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zdjęcia wgrane w panelu (nazwy z unikalnym identyfikatorem, nigdy nie są nadpisywane).
    location /storage/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zdjęcia demonstracyjne z `npm run images` mają stałe nazwy, więc krótszy cache.
    location /images/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    # Zasoby panelu Filament (adresy mają ?v=wersja).
    location ~ ^/(css|js|fonts)/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/ddp-security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Tylko front controller. Każdy inny plik .php (np. zostawiony przez pomyłkę) kończy się 404.
    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Pliki ukryte (.env, .git) nigdy nie wychodzą na zewnątrz. Wyjątek: .well-known dla certyfikatów.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
